<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Playground</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e2de; --soft: #efefec;
    --accent: #5e72e4; --warn-bg: #fff5e6; --warn-ink: #8a5300; --chip: #f2f2ef; --good: #1f6e3f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe7; --muted: #a09f9a; --line: #34332f; --soft: #2a2a27;
      --accent: #8a9af0; --warn-bg: #3a2a12; --warn-ink: #f0c27a; --chip: #2a2a27; --good: #8fdcaa; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 17px; letter-spacing: -0.2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-weight: 600; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { font: 600 12.5px system-ui, sans-serif; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .search { margin-top: 10px; width: 100%; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .list { overflow: auto; flex: 1; padding: 4px 8px 24px; }
  h2 { font-size: 11.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin: 16px 8px 6px; }
  .tok { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
  .tok:hover { background: var(--soft); }
  .tok.changed { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .sw { position: relative; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); overflow: hidden; }
  .sw input[type=color] { position: absolute; inset: -6px; width: 46px; height: 46px; border: 0; padding: 0; cursor: pointer; background: none; }
  .name { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .meta { color: var(--muted); font-size: 12px; }
  .meta code { font: 11.5px ui-monospace, Menlo, monospace; }
  .uses { font-size: 11.5px; color: var(--muted); background: var(--chip); border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
  .radius { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .radius input { width: 140px; }
  .rprev { width: 34px; height: 34px; border: 2px solid var(--accent); background: var(--soft); }
  .tools { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .tools.on { display: block; }
  .tools .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tools select { font: 12.5px system-ui, sans-serif; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 6px; max-width: 100%; }
  .tools .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .results { display: none; border-bottom: 1px solid var(--line); padding: 10px 16px 12px; max-height: 46vh; overflow: auto; }
  .results.on { display: block; }
  .results h3 { font-size: 13px; margin: 8px 0 4px; }
  .results p { margin: 4px 0; font-size: 12.5px; }
  .score { display: inline-block; font: 700 12px system-ui, sans-serif; border-radius: 99px; padding: 2px 8px; background: var(--chip); }
  .score.bad { background: var(--warn-bg); color: var(--warn-ink); }
  .score.good { background: color-mix(in srgb, #2f9e5b 18%, transparent); color: var(--good); }
  .pair { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--soft); font-size: 12.5px; }
  .pair:first-of-type { border-top: 0; }
  .aa { width: 40px; height: 28px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; font: 700 13px system-ui, sans-serif; }
  .ratio { font: 600 12px ui-monospace, Menlo, monospace; white-space: nowrap; text-align: right; }
  .ratio .need { display: block; font-weight: 400; color: var(--muted); }
  .fix { padding: 6px 0; border-top: 1px solid var(--soft); font-size: 12.5px; }
  .fix .name { display: inline; }
  .fix .why { color: var(--muted); }
  .fix.dropped { opacity: .6; }
  .tag { font: 600 11px system-ui, sans-serif; border-radius: 99px; padding: 1px 7px; margin-left: 4px; background: var(--chip); color: var(--muted); }
  .tag.ok { background: color-mix(in srgb, #2f9e5b 18%, transparent); color: var(--good); }
  .tag.no { background: var(--warn-bg); color: var(--warn-ink); }
  .busy { color: var(--muted); font-size: 12.5px; }
  .busy::after { content: ''; display: inline-block; width: 10px; height: 10px; margin-left: 6px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stage { position: relative; min-width: 0; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  iframe.pasFramed { position: absolute; top: 0; left: 0; transform-origin: top left; cursor: crosshair; }
  #pasOverlay { position: absolute; pointer-events: none; top: 0; left: 0; width: 0; height: 0; }
  .pasBox { position: absolute; border: 2px solid #ff5fae; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); box-sizing: border-box; }
  .pasBox.twin { border-color: #ffb648; border-style: dashed; }
  .pasBox.outline, .pasBox.element { border-color: #e0218a; box-shadow: 0 0 0 1px #fff, 0 0 0 2px rgba(0,0,0,.35); }
  .pasBox.control { border-color: #e0218a; border-width: 3px; box-shadow: 0 0 0 1px #fff, 0 0 0 2px rgba(0,0,0,.35); }
  .pasNote { font: 600 11px system-ui, sans-serif; border-radius: 99px; padding: 1px 7px; margin-left: 4px; background: var(--chip); color: var(--muted); }
  .pasBlocked { background: #fde8ea; color: #8f1d2c; border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .pasBlocked { background: #3d1519; color: #f6b2bb; } }
  .pasRow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  #pasText { flex: 1; min-width: 120px; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  #pasMic { position: relative; }
  #pasMic:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #pasMic.rec { background: #d1374a; border-color: #d1374a; color: #fff; }
  #pasMic.rec::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #fff; margin-right: 6px; vertical-align: -1px; animation: pasPulse 1s ease-in-out infinite; }
  @keyframes pasPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .pasTranscript { font-style: italic; color: var(--muted); margin: 6px 0 0; font-size: 12.5px; }
  .pasSwatches { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; vertical-align: -3px; }
  .pasSwatches .sw2 { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
  .pasAffected { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .pasPre { white-space: pre-wrap; background: var(--chip); border-radius: 8px; padding: 8px 10px; font: 12px ui-monospace, Menlo, monospace; margin: 6px 0; }
  .pasLive { margin-top: 10px; }
  .pasAbout { font-size: 12.5px; background: var(--soft); border-radius: 8px; padding: 8px 10px; }
  .pasAbout p { margin: 0 0 4px; }
  .pasAbout p:last-child { margin: 0; color: var(--muted); }
  .pasBudget { margin-top: 8px; font: 700 13px system-ui, sans-serif; }
  .pasCostNote { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pasClip { margin-top: 8px; }
  .pasClip p { margin: 0 0 6px; font-weight: 600; font-size: 12.5px; }
  .pasClip video { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; background: #000; }
  .toast { position: fixed; right: 16px; bottom: 16px; background: #111; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    .stage { order: -1; height: 55vh; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    .list { overflow: visible; }
    .results { max-height: none; overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } .busy::after { animation: none; } #pasMic.rec::before { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1 id="title">Token playground</h1>
      <div class="sub" id="sub">Loading tokens…</div>
      <div class="notice">Preview only: changes apply in this page. Nothing is merged.</div>
      <div class="pasLive" id="pasLive" hidden>
        <div class="pasAbout" id="pasAbout"></div>
        <div class="pasBudget" id="pasBudget" role="status"></div>
        <div class="pasCostNote" id="pasMine"></div>
        <div class="pasCostNote" id="pasCostNote"></div>
      </div>
      <div class="actions">
        <button id="reset" disabled>Reset all</button>
        <button id="copy" class="primary" disabled>Copy proposal link</button>
      </div>
      <div class="tools" id="tools">
        <div class="row">
          <button id="audit">Check contrast</button>
          <button id="dark" hidden>Build a dark theme</button>
          <select id="provider" hidden aria-label="Model">
            <option value="baseten">Muse Spark Open (Baseten, fast)</option>
            <option value="meta">Muse Spark (Meta hosted)</option>
          </select>
        </div>
        <div class="hint" id="toolsHint">WCAG AA text contrast, checked on the live app with the current token values.</div>
      </div>
      <div class="tools" id="pasTools">
        <div class="row">
          <button id="pasToggle" aria-pressed="false">Point and say</button>
        </div>
        <div class="pasRow" id="pasControls" hidden>
          <button id="pasMic" aria-pressed="false">Hold to talk</button>
          <input type="text" id="pasText" placeholder="Or point and type what to change…" aria-label="Point and type">
        </div>
        <div class="hint" id="pasHint">Off. Turn it on, then click something in the app and say or type what to change.</div>
        <div class="pasClip" id="pasClip" hidden></div>
      </div>
      <input class="search" id="search" type="search" placeholder="Filter tokens (e.g. action, blue, radius)" aria-label="Filter tokens">
    </header>
    <section class="results" id="results" aria-live="polite"></section>
    <section class="results" id="pasResults" aria-live="polite"></section>
    <div class="list" id="list" aria-live="polite"></div>
  </aside>
  <main class="stage" id="stage">
    <iframe id="app" title="Tokenized app"></iframe>
    <div id="pasOverlay" aria-hidden="true"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var frame = document.getElementById('app')
  var list = document.getElementById('list')
  var changes = {} // cssVar -> value
  var data = null

  function toast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show')
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show') }, 1600)
  }
  function root() { try { return frame.contentDocument && frame.contentDocument.documentElement } catch (e) { return null } }
  function current(cssVar) {
    var r = root(); if (!r) return ''
    return getComputedStyle(r).getPropertyValue('--' + cssVar).trim()
  }
  // <input type=color> needs #rrggbb.
  function toHex(v) {
    v = String(v || '').trim()
    var m = v.match(/^#([0-9a-f]{3})$/i); if (m) return '#' + m[1].split('').map(function (c) { return c + c }).join('')
    m = v.match(/^#([0-9a-f]{6})([0-9a-f]{2})?$/i); if (m) return '#' + m[1]
    m = v.match(/^rgba?\(\s*(\d+)[ ,]+(\d+)[ ,]+(\d+)/i)
    if (m) return '#' + [m[1], m[2], m[3]].map(function (n) { return (+n).toString(16).padStart(2, '0') }).join('')
    return '#000000'
  }
  function apply() {
    var r = root(); if (!r) return
    Object.keys(changes).forEach(function (k) { r.style.setProperty('--' + k, changes[k]) })
  }
  function set(cssVar, value, row) {
    changes[cssVar] = value
    var r = root(); if (r) r.style.setProperty('--' + cssVar, value)
    if (row) row.classList.add('changed')
    sync()
  }
  function sync() {
    var n = Object.keys(changes).length
    document.getElementById('reset').disabled = !n
    document.getElementById('copy').disabled = !n
    // Refresh swatches for tokens whose value cascades from an alias.
    Array.prototype.forEach.call(list.querySelectorAll('[data-var]'), function (row) {
      var k = row.getAttribute('data-var')
      var input = row.querySelector('input[type=color]')
      if (input && !changes[k]) input.value = toHex(current(k))
    })
  }
  function chain(t) {
    var out = [t.alias], seen = {}
    var byName = {}; data.tokens.forEach(function (x) { byName[x.name] = x })
    var cur = byName[t.alias]
    while (cur && cur.alias && !seen[cur.name]) { seen[cur.name] = 1; out.push(cur.alias); cur = byName[cur.alias] }
    return out
  }
  function row(t) {
    var el = document.createElement('div')
    el.className = 'tok' + (changes[t.cssVar] ? ' changed' : '')
    el.setAttribute('data-var', t.cssVar)
    el.setAttribute('data-search', (t.name + ' ' + (t.alias || '') + ' ' + t.tier + ' ' + t.kind).toLowerCase())
    var meta = t.alias ? '→ <code>' + chain(t).join(' → ') + '</code>' : '<code>' + (t.value || '') + '</code>'
    var uses = '<span class="uses" title="Places in the stylesheet that use this token">' + t.uses + ' use' + (t.uses === 1 ? '' : 's') + '</span>'
    if (t.kind === 'color') {
      el.innerHTML = '<label class="sw"><input type="color" aria-label="' + t.name + '"></label>' +
        '<div><div class="name">' + t.name + '</div><div class="meta">' + meta + '</div></div>' + uses
      var input = el.querySelector('input')
      input.value = toHex(current(t.cssVar) || t.value)
      input.addEventListener('input', function () { set(t.cssVar, input.value, el) })
    } else {
      var px = parseFloat(current(t.cssVar) || t.value) || 0
      el.innerHTML = '<div class="rprev" style="border-radius:' + px + 'px"></div>' +
        '<div><div class="name">' + t.name + '</div><div class="meta">' + meta + '</div>' +
        '<div class="radius"><input type="range" min="0" max="32" step="1" value="' + px + '" aria-label="' + t.name + '"><span class="meta">' + px + 'px</span></div></div>' + uses
      var range = el.querySelector('input'), label = el.querySelector('.radius .meta'), prev = el.querySelector('.rprev')
      range.addEventListener('input', function () { var v = range.value + 'px'; label.textContent = v; prev.style.borderRadius = v; set(t.cssVar, v, el) })
    }
    el.title = t.why || ''
    return el
  }
  function render() {
    list.innerHTML = ''
    var groups = [
      ['Semantic (what it is for)', function (t) { return t.tier === 'semantic' }],
      ['Component (where it is used)', function (t) { return t.tier === 'component' }],
      ['Primitive colors (what it is)', function (t) { return t.tier === 'primitive' && t.kind === 'color' }],
      ['Corner radius', function (t) { return t.tier === 'primitive' && t.kind === 'radius' }],
    ]
    groups.forEach(function (g) {
      var items = data.tokens.filter(g[1]); if (!items.length) return
      var h = document.createElement('h2'); h.textContent = g[0] + ' · ' + items.length; list.appendChild(h)
      items.forEach(function (t) { list.appendChild(row(t)) })
    })
  }

  document.getElementById('reset').addEventListener('click', function () {
    var r = root(); Object.keys(changes).forEach(function (k) { if (r) r.style.removeProperty('--' + k) })
    changes = {}
    if (window.__pasReset) window.__pasReset() // point and say: applied map, focus rule, outline, card
    render(); sync(); toast('Back to the merged values')
  })
  document.getElementById('copy').addEventListener('click', function () {
    var q = Object.keys(changes).map(function (k) { return k + ':' + String(changes[k]).replace(/^#/, '') }).join(',')
    var url = new URL(data.app, location.href).href.replace(/#.*$/, '') + '?tokens=' + encodeURIComponent(q)
    var done = function () { toast('Proposal link copied') }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt('Copy this link', url) })
    else prompt('Copy this link', url)
  })
  document.getElementById('search').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase()
    Array.prototype.forEach.call(list.querySelectorAll('.tok'), function (el) {
      el.style.display = !q || el.getAttribute('data-search').indexOf(q) >= 0 ? '' : 'none'
    })
  })

  // ---- Accessibility audit + Muse (audit fixes, dark theme) ------------------------------------------------------
  // The contrast check is deterministic and runs here on the live iframe (contrast.js). Muse is only reachable when
  // the page is served by `s2t playground` (local, key stays on the server); the static build hides those buttons.
  var C = null // contrast.js module
  var museOk = false
  var results = document.getElementById('results')
  var busy = false

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
  function colorTokens() {
    return data.tokens.filter(function (t) { return t.kind === 'color' }).map(function (t) {
      return { name: t.name, cssVar: t.cssVar, tier: t.tier, alias: t.alias, value: current(t.cssVar) }
    })
  }
  function audit() {
    var d = frame.contentDocument
    var res = C.auditLive(d, data.pairs || [])
    var checked = res.filter(function (r) { return r.status === 'pass' || r.status === 'fail' })
    return { all: res, checked: checked, fails: res.filter(function (r) { return r.status === 'fail' }), groups: C.groupFailures(res) }
  }
  function withTokens(groups) {
    var tv = colorTokens()
    return groups.map(function (g) {
      return { examples: g.examples, count: g.count, fg: g.fg, bg: g.bg, ratio: g.ratio, required: g.required, fgTokens: C.tokensForColor(g.fg, tv).slice(0, 4), bgTokens: g.gradient ? [] : C.tokensForColor(g.bg, tv).slice(0, 4), gradient: !!g.gradient }
    })
  }
  // Temporarily set some custom properties, run fn, put everything back exactly as it was.
  function trying(cs, fn) {
    var r = root(), prev = {}
    var thaw = C.freezeTransitions(frame.contentDocument) // no fade in or out: read end values, show no flicker
    cs.forEach(function (c) { prev[c.cssVar] = r.style.getPropertyValue('--' + c.cssVar); r.style.setProperty('--' + c.cssVar, c.css) })
    try { return fn() } finally {
      Object.keys(prev).forEach(function (k) { if (prev[k]) r.style.setProperty('--' + k, prev[k]); else r.style.removeProperty('--' + k) })
      getComputedStyle(r).color // settle the reverted values before transitions come back
      thaw()
    }
  }
  function pairRow(g, tokens) {
    var bigFont = g.large ? '17px' : '13px'
    return '<div class="pair"><div class="aa" style="color:' + esc(g.fg) + ';background:' + esc(g.bg) + ';font-size:' + bigFont + '" aria-hidden="true">Aa</div>' +
      '<div><div>' + esc(g.examples.map(function (x) { return '“' + x + '”' }).join(', ')) + (g.count > g.examples.length ? ' <span class="meta">+' + (g.count - g.examples.length) + ' more</span>' : '') + '</div>' +
      '<div class="meta"><code>' + esc(g.fg) + '</code> on <code>' + esc(g.bg) + '</code>' + (tokens ? ' · ' + esc(tokens) : '') + '</div></div>' +
      '<div class="ratio">' + g.ratio.toFixed(2) + ':1<span class="need">needs ' + g.required.toFixed(1) + (g.large ? ' (large)' : '') + '</span></div></div>'
  }
  function tokenHint(g) {
    var f = g.fgTokens.slice(0, 2).join(' / ') || 'text: no token', b = g.bgTokens.slice(0, 2).join(' / ') || (g.gradient ? 'a gradient (no token)' : 'bg: no token')
    return f + ' on ' + b
  }
  function scoreHtml(a) {
    var n = a.checked.length, f = a.fails.length
    var skipped = a.all.length - n
    return '<span class="score ' + (f ? 'bad' : 'good') + '">' + (n - f) + ' of ' + n + ' text pairs pass</span>' +
      (skipped ? ' <span class="meta">' + skipped + ' not checked (not visible in this view or over an image)</span>' : '')
  }
  function setBusy(on, msg) {
    busy = on
    ;['audit', 'dark', 'provider'].forEach(function (id) { document.getElementById(id).disabled = on })
    if (on) { results.classList.add('on'); results.insertAdjacentHTML('beforeend', '<p class="busy" id="busy">' + esc(msg) + '</p>'); results.scrollTop = results.scrollHeight }
    else { var b = document.getElementById('busy'); if (b) b.remove() }
  }
  function muse(body) {
    body.provider = document.getElementById('provider').value
    return fetch('api/muse', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j }) })
  }

  function runAudit() {

    if (!a.fails.length) html += '<p>Every checked text pair meets AA with the current token values.</p>'

  function askFix(a, groups) {

  function darkRound(prev, failures, notDarkBg) {

  // ---- Point and say ---------------------------------------------------------------------------------------------

  }

    return fetch(path, opts).then(function (r) {
      return r.json().then(function (j) {

  function pasBudget(b) {

    clip.innerHTML = '<p>' + PAS.escapeHtml(PAS.capMessage()) + '</p>' +

  function pasLayout() {

    // tall enough to fill the stage. One uniform scale, so page px = capture px inside the iframe.
    var s = Math.min(stage.clientWidth / vp.width, 1) || 1
    pas.scale = s
    frame.style.width = vp.width + 'px'
    frame.style.height = Math.ceil(stage.clientHeight / s) + 'px'
    frame.style.transform = 'scale(' + s + ')'

  function pasRenderOverlay() {

    var s = pas.scale || 1
    var boxes = PAS.overlayBoxesFor(pas.point, { width: vp.width * s, height: vp.height * s }, vp, scroll)

  }
  function pasOnClick(e) {

    var vp = pas.health.run.viewport

  function pasPoint(pt) {

      pasBusy(false)
      pas.point = r

      pasRenderOverlay()

      html += '<p>' + (el ? '<code>' + PAS.escapeHtml(el.tag) + '</code> “' + PAS.escapeHtml(el.text || '') + '”' +

      html += '<p class="meta">' + (tokName ? 'controlling token: <code>' + PAS.escapeHtml(tokName) + '</code>' : 'no token controls its color') +
        (r.pairs && r.pairs.count ? ' · used by ' + r.pairs.count + ' text pair' + (r.pairs.count === 1 ? '' : 's') : '') +

  function pasStartMic() {

    var n = cmp.affected.length || (r.predicted && r.predicted.affected) || 0
    var worstBefore = cmp.affected.length ? Math.min.apply(null, cmp.affected.map(function (a) { return a.from })) : (r.predicted && r.predicted.before && r.predicted.before.min) || 0
    var worstAfter = cmp.affected.length ? Math.min.apply(null, cmp.affected.map(function (a) { return a.to })) : (r.predicted && r.predicted.after && r.predicted.after.min) || 0
    if (n) html += '<p><span class="score good">' + PAS.escapeHtml(PAS.contrastLine(n, worstBefore, worstAfter)) + '</span></p>'
    if (r.summary && r.route !== 'contrast') html += '<p>' + PAS.escapeHtml(r.summary) + '</p>'
    html += '<p class="meta">' + PAS.escapeHtml(PAS.pageAuditLine(before, after)) + ', 0 regressions (checked live after applying)</p>'
    html += r.changes.map(function (c) { return pasChangeRow(c) }).join('')
    if (r.rejected && r.rejected.length) html += '<p class="pasAffected">' + r.rejected.length + ' proposed change(s) rejected as unsafe or unrelated</p>'
    html += pasKeepUndoButtons(live)
    pasResults.innerHTML = html
    pasResults.classList.add('on')
    pasWireButtons(live)
    var fails = function (a) { return a.filter(function (x) { return x.status === 'fail' }).length }
    pasState({ phase: 'done', result: { kind: 'applied', changes: live.map(function (c) { return { token: c.token, from: c.from, css: c.css } }), affected: n, before: worstBefore, after: worstAfter, pageFailBefore: fails(before), pageFailAfter: fails(after), checked: after.filter(function (x) { return x.status === 'pass' || x.status === 'fail' }).length, regressions: 0 }, doneAt: Date.now() })
  }
  function pasFinishFocus(r, transcript) {
    var html = '<h3>Focus ring</h3><p class="pasTranscript">“' + PAS.escapeHtml(transcript) + '”</p>'
    pasApplyChanges(r.changes)
    if (r.rule) pasInjectRule(r.rule)
    html += '<p id="pasFocusSummary">' + (r.summary ? PAS.escapeHtml(r.summary) : 'Focus-ring tokens applied.') + '</p>'
    var near = PAS.ringNote(r.ring)
    if (near) html += '<p class="notice">' + PAS.escapeHtml(near.charAt(0).toUpperCase() + near.slice(1)) + '.</p>'
    html += r.changes.map(function (c) { return pasChangeRow(c) }).join('')
    pasResults.innerHTML = html + '<p class="busy" id="pasFocusBusy">Checking keyboard focus: Tab through every control (about 10 seconds)…</p>'
    pasResults.classList.add('on')
    pasState({ phase: 'focus-check', focusAt: Date.now() })
    pasFetch('/__pas/api/focus-check', { changes: r.changes }).then(function (fc) {
      var b = document.getElementById('pasFocusBusy'); if (b) b.remove()
      // The card's summary reports the measured Tab-through, not the predicted coverage.
      var fs = document.getElementById('pasFocusSummary'); if (fs && fc.summary && r.summary) fs.textContent = r.summary.replace(/ The Tab-through check measures it next\.$/, '') + ' ' + fc.summary
      var line = PAS.focusLine(fc.before.pass, fc.after.pass, fc.after.measured)
      var worse = fc.compare && fc.compare.worse ? fc.compare.worse.length : 0
      var more = '<p><span class="score ' + (worse ? 'bad' : 'good') + '">' + PAS.escapeHtml(line) + '</span></p>'
      more += '<p class="meta">before: ' + fc.before.pass + ' pass, ' + fc.before.faint + ' faint, ' + fc.before.none + ' none · after: ' + fc.after.pass + ' pass, ' + fc.after.faint + ' faint, ' + fc.after.none + ' none · ' + (fc.ms / 1000).toFixed(1) + ' s</p>'
      if (worse) more += '<p class="meta">' + worse + ' control' + (worse === 1 ? '' : 's') + ' worse with this change.</p>'
      more += '<p class="hint">Press Tab in the app to see the ring.</p>'
      more += pasKeepUndoButtons(r.changes)
      pasResults.insertAdjacentHTML('beforeend', more)
      pasWireButtons(r.changes, true)
      pasState({ phase: 'done', result: { kind: 'focus', before: fc.before, after: fc.after, worse: worse, checkMs: fc.ms, nearest: near || null }, doneAt: Date.now() })
    }).catch(function (e) {
      var b = document.getElementById('pasFocusBusy'); if (b) b.remove()
      if (pasWasCapped(e)) return
      pasState({ phase: 'error', error: e.message })
      pasResults.insertAdjacentHTML('beforeend', '<p class="notice">Focus check failed: ' + PAS.escapeHtml(e.message) + '</p>')
    })
  }
  function pasKeepUndoButtons() {
    return '<div class="actions"><button id="pasKeep" class="primary">Keep (preview)</button><button id="pasUndo">Undo</button><button id="pasShowPr">Show PR command</button></div>'
  }
  function pasWireButtons(cs, isFocus) {
    var keep = document.getElementById('pasKeep')
    if (keep) keep.addEventListener('click', function () { keep.disabled = true; var u = document.getElementById('pasUndo'); if (u) u.disabled = true; toast('Kept as a preview. Copy the proposal link to share it.') })
    var undo = document.getElementById('pasUndo')
    if (undo) undo.addEventListener('click', function () { pasRevertChanges(cs); if (isFocus) pasInjectRule(null); undo.disabled = true; if (keep) keep.disabled = true; toast('Reverted') })
    var pr = document.getElementById('pasShowPr')
    if (pr) pr.addEventListener('click', function () {
      pr.disabled = true
      var cmd = PAS.prCommandText(pas.health && pas.health.run && pas.health.run.dir)
      pasResults.insertAdjacentHTML('beforeend', '<p class="meta">Shown, not run:</p><pre class="pasPre">' + PAS.escapeHtml(cmd) + '</pre>')
    })
  }
  // "Reset all": the shared `changes` are cleared by the caller; this clears point and say's own bookkeeping too
  // (applied map, the injected focus rule, the outline, the card, the driver state).
  window.__pasReset = function () {
    pas.applied = {}
    pasInjectRule(null)
    var el = frame.contentDocument && frame.contentDocument.getElementById('s2t-pas-focus-rule'); if (el) el.remove()
    pas.point = null
    pasOverlay.innerHTML = ''
    pasResults.innerHTML = ''; pasResults.classList.remove('on')
    var t = document.getElementById('pasText'); if (t) t.value = ''
    if (pas.on) document.getElementById('pasHint').textContent = 'On. Click something in the app, then say or type what to change.'
    window.__pas = { phase: pas.capped ? 'capped' : 'reset', capped: !!pas.capped, budget: pas.budget ? { left: pas.budget.left, total: pas.budget.total, mine: pas.budget.mine } : null, updatedAt: Date.now() }
  }
  function pasScroll() { if (pas.on && pas.point) pasRenderOverlay() }
  // Every (re)load of the iframe document: hook the click capture and scroll back up, and put the focus rule back.
  function pasAttach() {
    var d = frame.contentDocument; if (!d) return
    d.removeEventListener('click', pasOnClick, true)
    if (pas.on) d.addEventListener('click', pasOnClick, true)
    if (frame.contentWindow) { frame.contentWindow.removeEventListener('scroll', pasScroll); frame.contentWindow.addEventListener('scroll', pasScroll) }
    if (pas.rule) pasInjectRule(pas.rule)
  }

  function pasOn() {
    pas.on = true
    frame.classList.add('pasFramed')
    document.getElementById('pasControls').hidden = false
    document.getElementById('pasToggle').setAttribute('aria-pressed', 'true')
    document.getElementById('pasToggle').textContent = 'Point and say: on'
    document.getElementById('pasHint').textContent = 'On. Click something in the app, then say or type what to change.'
    pasAttach()
    pasLayout()
  }
  function pasOff() {
    pas.on = false
    frame.classList.remove('pasFramed')
    frame.style.width = ''; frame.style.height = ''; frame.style.transform = ''
    pasOverlay.innerHTML = ''; pasOverlay.style.width = '0'; pasOverlay.style.height = '0'
    document.getElementById('pasControls').hidden = true
    document.getElementById('pasToggle').setAttribute('aria-pressed', 'false')
    document.getElementById('pasToggle').textContent = 'Point and say'
    document.getElementById('pasHint').textContent = 'Off. Turn it on, then click something in the app and say or type what to change.'
    if (frame.contentDocument) frame.contentDocument.removeEventListener('click', pasOnClick, true)
    pas.point = null
  }

  // Live demo (the server meters calls, so health carries a budget): explain the page, show the counter and the cost of
  // each action, turn point and say on, and default to typing on touch screens (hold-to-talk needs a mouse or keys).
  function pasLiveMode(h) {
    var about = document.getElementById('pasAbout')
    about.innerHTML = PAS.WHAT_THIS_IS.map(function (t) { return '<p>' + PAS.escapeHtml(t) + '</p>' }).join('')
    document.getElementById('pasCostNote').textContent = PAS.COST_NOTE
    document.getElementById('pasToggle').title = PAS.COST_TITLES.app
    var mic = document.getElementById('pasMic')
    if (!mic.disabled) mic.title = PAS.COST_TITLES.mic
    document.getElementById('pasText').title = PAS.COST_TITLES.text
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) { // touch: typing is the default path
      mic.hidden = true
      document.getElementById('pasText').placeholder = 'Tap the app, then type what to change…'
    }
    pasBudget(h.budget)
    if (h.budget.mine < 1) return pasCapped()
    if (!pas.on) pasOn()
  }

  var pasStarted = false
  function initPas() {
    if (pasStarted) { if (pas.health) pasAttach(); return } // a reload of the iframe: re-hook, don't re-wire the panel
    pasStarted = true
    Promise.all([import('./pas-client.js'), C ? Promise.resolve(C) : import('./contrast.js')]).then(function (mods) {
      PAS = mods[0]
      if (!C) C = mods[1]
      return fetch('/__pas/api/health').then(function (r) { return r.ok ? r.json() : null })
    }).then(function (h) {
      if (!h || !h.ok) return
      pas.health = h
      document.getElementById('pasTools').classList.add('on')
      document.getElementById('pasToggle').addEventListener('click', function () { if (pas.on) pasOff(); else pasOn() })
      var mic = document.getElementById('pasMic')
      if (!h.providers.asr.ok) { mic.disabled = true; mic.title = 'Speech is not available (no ASR key); typing still works.' }
      mic.addEventListener('pointerdown', function (e) { e.preventDefault(); pasStartMic() })
      mic.addEventListener('pointerup', pasStopMic)
      mic.addEventListener('pointerleave', pasStopMic)
      mic.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !pas.mic) { e.preventDefault(); pasStartMic() } })
      mic.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') pasStopMic() })
      document.getElementById('pasText').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target.value.trim()) pasIntent(e.target.value.trim())
      })
      window.addEventListener('resize', function () { if (pas.on) pasLayout() })
      pasAttach()
      if (h.budget) pasLiveMode(h)
      pasState({ phase: 'ready', health: { focusBaseline: h.focusBaseline && h.focusBaseline.summary } })
    }).catch(function (e) { void e }) // no /__pas/ routes (static build or lane A not up yet): the toggle stays hidden
  }

  var toolsStarted = false
  function initTools() {
    if (toolsStarted || !data.pairs || !data.pairs.length) return
    toolsStarted = true
    import('./contrast.js').then(function (m) {
      C = m
      document.getElementById('tools').classList.add('on')
      document.getElementById('audit').addEventListener('click', runAudit)
      return fetch('api/muse').then(function (r) { return r.ok ? r.json() : null }).catch(function (e) { void e; return null })
    }).then(function (j) {
      if (!C || !j || !j.ok) return
      museOk = true
      var ids = j.providers.map(function (p) { return p.id })
      var sel = document.getElementById('provider')
      Array.prototype.slice.call(sel.options).forEach(function (o) { if (ids.indexOf(o.value) < 0) o.remove() })
      sel.hidden = false
      document.getElementById('dark').hidden = false
      document.getElementById('dark').addEventListener('click', buildDark)
      document.getElementById('toolsHint').textContent = 'Contrast is checked here on the live app. Muse proposes; every proposal is re-checked before it is offered. Sends token names, values and contrast numbers only.'
    }).catch(function (e) { void e }) // no contrast.js (older static build): the audit stays hidden
  }

  fetch('tokens.json').then(function (r) { return r.json() }).then(function (d) {
    data = d
    document.getElementById('title').textContent = d.title
    document.title = d.title + ' · Token playground'
    document.getElementById('sub').textContent = d.tokens.length + ' tokens you can change · ' + d.edits + ' hardcoded values replaced · named by ' + d.namer
    var home = new URL(d.app, location.href).pathname
    frame.addEventListener('load', function () {
      // A hard reload of a route the app's router pushed (Argon: /admin/index) is the playground's 404 JSON: go back
      // to the app's home under /app/ instead (the app routes itself from there).
      try {
        var doc = frame.contentDocument
        if (doc && doc.location.pathname.indexOf(home) !== 0 && /"error"\s*:\s*"not found"/.test(doc.body ? doc.body.textContent : '')) { frame.src = home; return }
      } catch (e) { void e }
      // The app is a single-page app: wait for its styles, then render the panel from live values.
      setTimeout(function () { apply(); render(); sync(); initTools(); initPas() }, 400)
    })
    // Reload the app frame from its home, never from its current (router-pushed) URL.
    window.__reloadApp = function () { frame.src = home }
    frame.src = d.app
  }).catch(function (e) {
    document.getElementById('sub').textContent = 'Could not load tokens.json (' + e.message + ')'
  })
})()
</script>
</body>
</html>
