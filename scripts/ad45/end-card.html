<!doctype html><meta charset="utf-8"><title>Screenshot to Tokens end card</title>
<style>
html,body{margin:0;height:100%;background:#151514;color:#e8e8e4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
.w{box-sizing:border-box;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 9vw}
h1{margin:0;font-size:clamp(56px,6.4vw,120px);font-weight:700;letter-spacing:-.02em;line-height:1.05;color:#fff}
.tg{margin:.6em 0 0;font-size:clamp(28px,2.2vw,46px);font-weight:600;line-height:1.3;color:#7ee2a8;max-width:30em}
.os{margin:2.2em 0 0;font-size:clamp(26px,1.7vw,38px);font-weight:600;color:#e8e8e4}
.gh{margin:.35em 0 0;font:500 clamp(24px,1.6vw,36px)/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8a9af0}
.bt{display:inline-block;align-self:flex-start;margin:1.6em 0 0;padding:.6em 1.1em;border-radius:14px;background:#5e72e4;color:#fff;font-size:clamp(26px,1.7vw,38px);font-weight:700}
.cr{margin:2.6em 0 0;font-size:clamp(18px,1.05vw,24px);color:#8a8a84}
body.tall .w{padding:0 6vw}
body.tall h1{font-size:104px}
body.tall .tg{font-size:39px}
body.tall .os,body.tall .bt{font-size:38px}
body.tall .gh{font-size:31px}
body.tall .cr{font-size:26px}
body.sq h1{font-size:84px}
body.sq .tg{font-size:36px}
body.sq .os,body.sq .bt{font-size:32px}
body.sq .gh{font-size:28px}
body.sq .cr{font-size:22px}
</style>
<body><div class="w">
<h1>Screenshot to Tokens</h1>
<p class="tg">A design system from a screenshot in seconds.<br>A more accessible app from the tokens in one change.</p>
<div class="os">Open source · Apache-2.0</div>
<div class="gh">github.com/nhunsaker/screenshot-to-tokens</div>
<div class="bt">Download the code and run it on your app today</div>
<div class="cr">Built with SAM 3.1, Muse Spark and Meta’s speech model</div>
</div>
<script>const r=innerWidth/innerHeight;document.body.className=r<0.8?'tall':(r<1.2?'sq':'')</script>
</body>
