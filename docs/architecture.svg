<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="540" fill="#ffffff"/>

  <!-- title -->
  <text x="600" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Screenshot to Tokens: the pipeline</text>

  <!-- legend -->
  <rect x="40" y="40" width="16" height="16" rx="3" fill="#fff1e0" stroke="#c2660a" stroke-width="1.5"/>
  <text x="62" y="52" font-size="12.5" fill="#1e293b">Meta model (SAM 3.1, Muse Spark)</text>

  <rect x="340" y="40" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="362" y="52" font-size="12.5" fill="#1e293b">Deterministic code</text>

  <rect x="540" y="40" width="16" height="16" rx="3" fill="#e6f7f1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="562" y="52" font-size="12.5" fill="#1e293b">Human (review step)</text>

  <!-- ================= ROW 1 ================= -->
  <!-- 1. Running app -->
  <g>
    <rect x="40" y="90" width="170" height="92" rx="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Running app</text>
    <text x="125" y="146" text-anchor="middle" font-size="10.5" fill="#475569">
      <tspan x="125">no design</tspan>
      <tspan x="125" dy="14">tokens yet</tspan>
    </text>
  </g>

  <!-- 2. Capture -->
  <g>
    <rect x="230" y="90" width="170" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="315" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Capture</text>
    <text x="315" y="146" text-anchor="middle" font-size="10.5" fill="#475569">
      <tspan x="315">Playwright: screenshot</tspan>
      <tspan x="315" dy="14">+ computed styles</tspan>
    </text>
  </g>

  <!-- 3. Segment (Meta model) -->
  <g>
    <rect x="420" y="90" width="170" height="92" rx="10" fill="#fff1e0" stroke="#c2660a" stroke-width="1.5"/>
    <text x="505" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c3a08">Segment</text>
    <text x="505" y="146" text-anchor="middle" font-size="10.5" fill="#8a5a1f">
      <tspan x="505">SAM 3.1 / vision</tspan>
      <tspan x="505" dy="14">fallback / DOM mock</tspan>
    </text>
  </g>

  <!-- 4. Join -->
  <g>
    <rect x="610" y="90" width="170" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="695" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Join</text>
    <text x="695" y="146" text-anchor="middle" font-size="10.5" fill="#475569">
      <tspan x="695">style value → smallest</tspan>
      <tspan x="695" dy="14">containing region</tspan>
    </text>
  </g>

  <!-- 5. Cluster -->
  <g>
    <rect x="800" y="90" width="170" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="885" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Cluster</text>
    <text x="885" y="146" text-anchor="middle" font-size="10.5" fill="#475569">
      <tspan x="885">merge drift: ΔE /</tspan>
      <tspan x="885" dy="14">px tolerance</tspan>
    </text>
  </g>

  <!-- 6. Name (Meta model) -->
  <g>
    <rect x="990" y="90" width="170" height="92" rx="10" fill="#fff1e0" stroke="#c2660a" stroke-width="1.5"/>
    <text x="1075" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c3a08">Name</text>
    <text x="1075" y="146" text-anchor="middle" font-size="10.5" fill="#8a5a1f">
      <tspan x="1075">Muse Spark,</tspan>
      <tspan x="1075" dy="14">validated</tspan>
    </text>
  </g>

  <!-- row 1 arrows -->
  <line x1="210" y1="136" x2="228" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="136" x2="418" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="136" x2="608" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="136" x2="798" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="136" x2="988" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- connector: Name -> Review -->
  <line x1="1075" y1="182" x2="1075" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= ROW 2 ================= -->
  <!-- 7. Review (human) -->
  <g>
    <rect x="990" y="250" width="170" height="92" rx="10" fill="#e6f7f1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="1075" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b4f45">Review</text>
    <text x="1075" y="306" text-anchor="middle" font-size="10.5" fill="#1f6f5c">
      <tspan x="1075">person: accept /</tspan>
      <tspan x="1075" dy="14">rename / reject / merge</tspan>
    </text>
  </g>

  <!-- 8. Emit -->
  <g>
    <rect x="800" y="250" width="170" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="885" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Emit</text>
    <text x="885" y="306" text-anchor="middle" font-size="10.5" fill="#475569">
      <tspan x="885">tokens.css,</tspan>
      <tspan x="885" dy="14">DTCG JSON</tspan>
    </text>
  </g>

  <!-- 9. Rewrite -->
  <g>
    <rect x="610" y="250" width="170" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="695" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Rewrite</text>
    <text x="695" y="306" text-anchor="middle" font-size="10.5" fill="#475569">
      <tspan x="695">CSS / Vue / JSX / SVG</tspan>
      <tspan x="695" dy="14">→ var(--token, fallback)</tspan>
    </text>
  </g>

  <!-- 10. Verify -->
  <g>
    <rect x="420" y="250" width="170" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="505" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Verify</text>
    <text x="505" y="306" text-anchor="middle" font-size="10.5" fill="#475569">
      <tspan x="505">3 pixel-diff</tspan>
      <tspan x="505" dy="14">checks</tspan>
    </text>
  </g>

  <!-- 11. PR -->
  <g>
    <rect x="230" y="250" width="170" height="92" rx="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="315" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Pull request</text>
    <text x="315" y="306" text-anchor="middle" font-size="10.5" fill="#475569">
      <tspan x="315">human-reviewed,</tspan>
      <tspan x="315" dy="14">ready to merge</tspan>
    </text>
  </g>

  <!-- row 2 arrows (flow runs right to left) -->
  <line x1="990" y1="296" x2="972" y2="296" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="296" x2="782" y2="296" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="296" x2="592" y2="296" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="296" x2="402" y2="296" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= SIDE BRANCH ================= -->
  <line x1="885" y1="342" x2="885" y2="388" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="900" y="368" font-size="10.5" font-style="italic" fill="#64748b">side branch</text>

  <g>
    <rect x="800" y="390" width="170" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="885" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Sorb live preview</text>
    <text x="885" y="446" text-anchor="middle" font-size="10.5" fill="#475569">
      <tspan x="885">tokens.css → running</tspan>
      <tspan x="885" dy="14">app, no rebuild</tspan>
    </text>
  </g>

  <!-- caption -->
  <text x="600" y="505" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">Every model step (orange) has an offline stand-in. Deterministic code (gray) guarantees the final shape.</text>
</svg>
